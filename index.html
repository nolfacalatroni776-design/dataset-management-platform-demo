 train、test。选择后立即刷新列表；“全部划分”查看该子集的全部成员。`,`当前子集的划分与成员归属。`],[`字段规则|字段定义`,`约定这个子集有哪些字段，以及字段的名称、类型和角色。首次确认后，后续导入按同一套规则检查。`,`导入时确认的子集字段定义。`],[`字段名称|保存字段名`,`数据保存后的字段名。名称不能为空或重复；它会出现在浏览、筛选、模型输入和导出中。`,`首次导入的字段确认，或当前步骤的字段映射。`],[`字段类型|类型`,`决定字段值按文本、数值、JSON 或媒体等哪种方式读取和校验。列表类型表示一条数据可包含多个同类值。`,`子集字段定义或当前输出定义。`],[`字段角色|角色`,`row_data 表示业务内容，metadata 表示辅助信息，resource 表示资源引用。角色帮助组织字段；模型输入仍需明确选择。`,`子集字段定义。`],[`允许缺失|空值|缺失值`,`普通业务字段允许未提供或为 null。未提供、null 和空字符串分别展示，不能把它们当成同一种值。`,`导入的原始记录。`],[`数据编号|item_no`,`便于人阅读的子集内编号。旁边的数据 ID 用于稳定关联任务、结果和版本；跨子集移动可能重新分配编号。`,`系统为数据分配的编号。`],[`数据 ID|id|原始身份与关系|数据身份`,`一条数据的稳定身份。版本、子集成员和任务结果通过它关联；移动或从草稿删除成员时沿用这个 ID。`,`导入数据时由系统生成。`],[`当前范围|数据范围|范围|版本 / 子集|版本 / 子集 / 划分`,`这次浏览或任务针对的版本、子集和划分。“全部划分”包含该子集各划分的完整成员。`,`页面顶部的定位；任务提交后保留提交时的范围。`],[`完整结果|完整命中|查询范围|完整输入`,`当前范围中满足已应用查询的全部数据，包含其他分页。它不同于当前页显示的条数。`,`当前范围及已应用的查询条件。`],[`实际选择|本页已选|本页所选数据|当前已选|现有选择|已有选择|本次选择`,`在当前页面勾选的数据名单，翻页时可保留。批量操作使用这份名单，不能只取屏幕上当前显示的行。`,`当前页面的临时选择。`],[`预计新增|新增`,`确认加入后，相比当前选择新增的数据条数。已经选中的 ID 不重复计算。`,`拟加入名单与已有选择的差集。`],[`实际条数|范围数量|确认输入|实际输入|实际参与|应处理|本次应处理`,`排除跳过项后，实际交给本次任务处理的数据量。提交后按固定名单执行。`,`提交前的输入检查和参与名单。`],[`未参与成员|空值 / 缺失 / 类型不符|字段为空、缺失或类型不符`,`因为输入为空、字段缺失或不符合所需类型而未参与的数据。页面需要显示跳过原因，不能混进成功数量。`,`本次任务的逐条输入检查。`],[`成功数据|成功|已成功，保持不变`,`这次任务中已经完成并保存结果的数据。重试失败项时，这部分保持已有结果。`,`任务执行记录。`],[`失败数据|失败|处理失败`,`已经尝试处理但没有成功的数据。原因来自本次执行，和未开始处理的数据分开统计。`,`任务执行返回的状态与错误信息。`],[`未处理|未开始`,`还没有完成处理的数据，可能在等待调度或随任务取消而停止。不能计作成功空结果。`,`任务输入名单与已保存结果的差集。`],[`状态|结果|状态说明|处理结果`,`当前对象最近的处理状态或结果摘要。待执行、进行中、部分完成、失败和已完成需要有可辨认的展示。`,`对象状态和最近一次执行记录。`],[`任务|任务名称|任务 / 来源|任务 / 类型`,`任务名称和编号。名称说明做什么，编号用于查找执行记录、输入配置及结果。`,`提交任务时保存的记录。`],[`任务类型`,`本次要完成的工作，例如分类、检测、转写、生成或评分。可选项随输入字段类型变化。`,`当前模块提供的兼容任务类型。`],[`发起人|操作人|操作者`,`谁发起这项操作。人工操作显示用户，自动执行显示系统；任务可以另显示关联编号。`,`操作或任务提交时的身份。`],[`操作时间|时间|更新时间|统计时间|创建时间`,`对应事件发生或数据更新的时间。统计类数据要同时保留统计时间，方便判断是否需要刷新。`,`对象记录或统计任务的时间戳。`],[`查询条件|查询规则|范围与条件`,`已应用的关键词、字段条件和相似查询。保存视图只保存已生效的条件，未提交的编辑需要先处理。`,`当前浏览页已应用的查询。`],[`切换视图|视图|视图名称`,`保存当前范围、查询和展示设置，便于以后继续浏览。同一子集名称唯一，最多保存 5 个；下拉底部可新建。`,`当前子集保存的视图。`],[`视图说明|说明（选填）`,`给保存的视图补充一句说明，最多 200 字。它帮助区分用途，不会成为筛选条件。`,`创建视图时填写。`],[`展示方式`,`保存表格或画廊、画廊预览字段、每页条数和可见列；再次打开视图时恢复这些设置。`,`创建或更新视图时的浏览设置。`],[`画廊预览字段|预览字段`,`每张卡片用哪个字段作为预览。媒体显示资源，文本和 JSON 显示内容摘要；卡片始终代表完整一条数据。`,`当前子集的字段定义及该条数据的字段值。`],[`排序|结果排序`,`控制完整结果的显示顺序，再按页取数。普通排序不改变已应用的查询和已选名单。`,`当前页面的排序设置。`],[`每页条数`,`一次显示多少条结果。改变后回到第一页；它只改变分页，不减少实际结果或操作范围。`,`当前浏览设置。`],[`相似度|相似得分`,`查询样本与结果的向量相似程度，用来排序近似样本。它不是模型回答的准确率，也不是质量评分。`,`当前查询使用的同一向量结果；Demo 使用示例特征。`],[`字段范围|统计字段`,`选择查看哪个字段的分布或执行字段条件。不同子集只提供自己的字段。`,`当前子集的字段定义。`],[`抽取方式`,`按数量抽取，或按比例换算要抽取的数量。候选池来自当前完整结果，确认前先预览名单。`,`当前抽取配置。`],[`抽取数值|采样数量|策展采样数量`,`本次要取多少条。不能超过候选池或页面标示的单次上限；确认后加入当前选择。`,`当前输入与候选池数量。`],[`随机种子`,`控制随机抽取或分配的结果。输入相同种子且候选名单不变时，可得到相同结果。`,`本次抽取或分配的配置。`],[`候选池|拟选名单`,`供本次抽取的数据范围，以及预览抽中的具体 ID。预览本身不改变当前选择。`,`完整查询命中与本次随机抽取结果。`],[`目标草稿|当前草稿`,`本次成员变更写入的草稿版本。已发布版本保持固定，需要在草稿中调整。`,`当前数据集可写版本。`],[`目标子集|新子集名称|子集名称|来源子集`,`选择或创建本次操作使用的子集。跨子集移动或合并前，要检查字段名称、类型和角色是否一致。`,`当前版本子集及本次输入。`],[`目标划分|新划分名称|新增空划分|第一划分比例|第二划分比例|未命中数据承接划分`,`指定成员在目标子集内的归属。新增空划分不自动分配成员；比例分配要核对预览和未命中成员的去向。`,`当前子集划分与本次分配方案。`],[`移动范围|确认后的目标|目标位置|移动目标`,`确认后实际修改的草稿成员及其目标子集、划分。数据 ID 保留，其他成员沿用原位置。`,`已选名单和本次目标配置。`],[`删除对象|影响范围|影响数据`,`明确这次操作作用于哪个数据集、版本、子集或哪些数据 ID。提交前需要能核对完整名单和数量。`,`本次操作的固定对象名单。`],[`操作摘要|操作记录|最近活动`,`记录操作名称、对象、版本/子集/划分、结果、操作人和时间，有任务时显示任务编号。概览显示最近 3 条，完整记录提供筛选和变更明细。`,`同一份数据集操作记录。`],[`记录 ID`,`这条操作记录的唯一编号，用于定位一次具体变更。它和任务 ID 分别保存。`,`系统生成的操作记录。`],[`版本修订`,`草稿在这次变更前后的修订号，用来定位当时的内容。它不是另一个发布版本。`,`草稿提交变更的记录。`],[`字段 / 对象|操作前|操作后`,`展开一次操作，逐项展示改了什么及变更前后的值。名单较多时保留可核对的 ID。`,`该次操作保存的变更详情。`],[`关联任务`,`若本次操作生成或关联任务，显示其任务 ID，可继续查看输入、进度与结果。`,`操作记录保存的任务关联。`],[`删除原因`,`记录为什么回收整个数据集，供恢复检查和后续审计查看。`,`发起删除时填写。`],[`恢复期限|恢复截止时间|原恢复截止`,`数据集进入回收站后保留 7 天，截止前可检查恢复。彻底删除或清空回收站会提前结束恢复期。`,`进入回收站的时间和保留策略。`],[`清理任务|恢复状态`,`显示是否仍可恢复，以及物理清理的执行状态。清理失败可以重试失败项，结束恢复期后不能再恢复。`,`回收站状态与异步清理任务。`],[`数据集业务内容`,`清理范围包括数据集及版本、成员关系、原始字段和该数据集内的结果等业务内容。`,`本次清理的数据集归属检查。`],[`平台写入的专属文件|平台文件`,`平台为该数据集保存且没有其他引用的专属文件可进入清理；共享文件需先检查引用。`,`文件归属、引用关系及删除权限检查。`],[`共享文件|外部原文件与独立配置`,`仍被其他对象引用的共享文件、客户对象存储中的原文件和独立连接配置继续保留。`,`清理任务的引用检查。`],[`输入字段|模型输入|向量输入|文本输入`,`明确把哪些字段交给模型。文本、JSON 和媒体按各自类型处理；字段角色不会自动把其他业务字段一起拼入。`,`当前子集字段及本次输入选择。`],[`输入类型|模态|人工模态标签|自动模态`,`文本、图像、音频、视频、文档、JSON、点云等内容类型。模型选择按实际字段类型匹配，人工标签用于数据集说明。`,`字段定义或用户补充的数据集信息。`],[`输入顺序|字段顺序`,`多个字段一起作为模型输入时，使用这里的排列顺序。文本字段按顺序换行拼接；列表资源先逐个处理再汇聚。`,`本次输入字段的排序。`],[`实际输入预览|输入预览`,`用一条实际数据预览送入模型的内容和字段顺序。用于核对输入，完整任务仍按固定名单处理。`,`本次选定字段的原始值。`],[`向量模型|分析向量模型|模型|模型版本|模型与版本`,`本次采用的具体模型与固定版本。可选模型要兼容输入类型；任务提交后保留该版本。`,`平台模型列表及本次选择；Demo 模拟执行。`],[`向量结果版本|当前向量结果|结果版本`,`已有向量结果的编号，包含输入字段、模型和参与数据。复用时要与当前范围、字段配置匹配。`,`已完成的向量构建任务。`],[`向量维度`,`每条数据生成的向量包含多少个数值，由所选模型决定。它不是画布的二维坐标。`,`所选向量模型的规格。`],[`覆盖|扫描覆盖|可参与构建|待构建数据`,`显示已有可用结果或本次可处理的数据量，并列出还需补齐的部分；字段空缺和处理失败要分开。`,`当前名单与已有处理结果的比对。`],[`输出|已保存结果|输出版本`,`本次任务产出的结果，以及可继续使用的中间结果编号。后续操作应引用对应版本。`,`任务保存的产出记录。`],[`构建类型|处理步骤|步骤|执行步骤`,`按顺序展示本次要执行或已执行的步骤。已有可用中间结果可以复用，失败步骤单独重试。`,`任务提交时的配置及执行记录。`],[`降维方法`,`把高维向量投影到二维画布的方法。UMAP 和 t-SNE 影响点位布局；已有相似检索不依赖二维投影。`,`语义画布的投影配置。`],[`近邻数|投影近邻数`,`UMAP 计算布局时关注多少个邻居。数值较小更关注局部结构，较大更关注整体分布；修改后需重新生成投影。`,`本次二维投影参数。`],[`最小距离|投影最小距离`,`UMAP 布局中相邻点允许靠多近。数值越小，局部点群越紧；修改后需重新生成投影。`,`本次二维投影参数。`],[`困惑度 Perplexity|投影困惑度`,`t-SNE 计算每个点的邻域规模，需小于参与投影的数据量。调整后重新生成布局。`,`本次二维投影参数。`],[`点位着色`,`按已有字段值、聚类分组或独特性给点着色。切换颜色只改变显示，不会重新计算向量和分组。`,`原始字段或已保存的聚类分析结果。`],[`已绘制|可绘制数据|未绘制`,`有可用二维坐标的数据才显示为点。未绘制数量单列，可能还没有向量、输入不合格或投影未完成。`,`本次画布投影结果及输入检查。`],[`圈选预览`,`在画布中框选得到的拟选名单。确认“加入当前选择”后，才用于后续移动、预标注或导出。`,`本次拖动框覆盖到的数据点。`],[`选择重复判断方法`,`完全重复按所选内容的哈希判断；语义近重复按向量相似度判断。缺少材料时，在本次分析中准备。`,`当前字段和重复检测配置。`],[`相似度阈值|重复相似度阈值`,`达到该相似度的数据才进入近重复组。阈值在 0–1 之间；调高后判断更严格。`,`当前重复检测配置及向量相似度。`],[`重复组|重复组数|冗余数据|可移出冗余`,`一个重复组内可保留代表数据，其余作为候选冗余。统计按本次分析的固定范围计算。`,`本次重复检测结果和已保存保留项。`],[`聚类方法|期望簇数 K|聚类簇数`,`将相似数据分为 K 个簇。K 是希望得到的分组数，需要在允许范围内；它不代表预先定义的业务类别。`,`当前聚类配置。`],[`策展结果分组|聚类分组|簇|分组`,`查看某个重复组或聚类簇的成员。分组来自本次分析，不会直接修改子集和划分归属。`,`本次分析保存的分组结果。`],[`策展结果排序|独特性|独特性分数`,`按当前向量分析的数据差异程度排序，方便寻找较少见的样本。它是相对分数，不等于数据质量好坏。`,`本次聚类分析的示例特征与独特性结果。`],[`代表样本|保留项|保留`,`从组内指定要保留的数据。保存保留项后，再确认是否从当前草稿移出其余冗余数据。`,`当前重复组成员和保留项选择。`],[`质量检测字段|质量字段类型|字段 / 类型`,`按当前子集实际字段类型选择扫描对象。文本、数值、JSON 和各类媒体分别匹配检测项，列表逐元素处理。`,`当前子集的字段定义。`],[`检测指标|字段质量检测项`,`该类型字段支持的质量检查项。例如图片看亮度和清晰度，音频看静音和削波，文本看字符数。`,`平台按字段类型提供的检测项。`],[`潜在问题`,`指标落在设定正常区间之外的数据条数，按完整数据去重。它表示值得复核，并非已经确定的数据错误。`,`本次扫描指标与当前阈值。`],[`有效指标|有效资源|指标值`,`扫描得到的具体数值。列表媒体逐个资源保存结果；一条数据含多个值时，可显示范围并展开明细。`,`扫描结果；文本和结构字段按实际值计算，媒体使用示例结果。`],[`正常下界|质量正常下界|拖动正常下界|正常上界|质量正常上界|拖动正常上界`,`设置当前指标的正常区间，上下界均包含在内。调整后立即展示区间外的数据；保存后保留阈值并重新标为待复核。`,`当前扫描指标的默认值或上次保存的阈值。`],[`复核|质量复核状态`,`标记当前字段的当前检测项是否已检查。阈值未保存、输入已变化时，需要先处理这些变化。`,`用户对这次扫描结果的复核标记。`],[`质量结果状态|质量分布与数据复核`,`在潜在问题、全部数据、缺失/格式错误、扫描失败及选中指标区间间切换。只改变结果列表。`,`本次扫描保存的逐条结果。`],[`缺失 / 格式|缺失 / 格式错误`,`字段缺失、空值或值不符合字段类型的数据，与已经扫描出数值的正常/异常数据分开统计。`,`逐条字段检查。`],[`读取失败|扫描失败`,`字段存在，但资源读取或扫描未能完成。列表资源可能部分成功，需保留失败的具体资源和原因。`,`本次资源扫描记录。`],[`任务数据范围`,`选择完整当前范围或按配置确定的候选数据。正式提交保存实际 ID 和输入快照，后续筛选变化不改变任务输入。`,`当前版本成员、范围和任务选择。`],[`背景字段（可选）|背景字段`,`补充给模型或评价使用的背景信息。与主要输入字段分开选择；参考答案在评价步骤另行配置。`,`所选数据中的辅助字段。`],[`预测来源|已有预测来源`,`可以调用模型生成预测，或复用兼容任务的已有结果。复用结果需匹配版本、子集、输入字段和输出类型。`,`本次选择的模型或已有预测任务。`],[`任务模型与版本`,`产生待评价预测的模型及其版本，和负责打分的评分模型分开记录。`,`本次预测配置。`],[`任务要求`,`告诉任务模型要完成什么工作。它影响预测输出；正式提交后和输入一起保存。`,`创建难例任务时填写。`],[`评价方式|评价`,`确定用什么依据判断预测结果：参考答案、结构化指标或评分规则。可选项随任务类型变化。`,`本次任务类型与评价配置。`],[`评分模型`,`按评分规则判断结果的模型。与生成预测的任务模型分别设置、分别保存版本。`,`本次评价配置。`],[`评分规则 Rubric|新评分规则`,`写清楚评分维度、判断标准和分数含义。重新评价会新建评价记录，并复用原有预测。`,`本次输入的评分规则。`],[`参考字段|参考来源|参考|参考内容`,`用于判断预测是否正确的参考答案或标注。应独立于本次预测；内容缺失或结构不匹配时单列为无法评价。`,`所选数据的参考字段或已配置的参考内容。`],[`预测坐标|参考坐标`,`明确预测与参考的坐标格式和单位。需要对齐到同一个资源、视频帧或像素网格，才能计算指标。`,`预测/参考结构及本次坐标配置。`],[`IoU|IoU 阈值`,`判断两个框或掩码是否匹配的重叠比例门槛。预测和参考按同类别一对一匹配，未匹配项分别计误检和漏检。`,`本次视觉评价配置。`],[`主要指标|分类指标|筛选指标|难例筛选指标|指标`,`选择按哪项评价结果筛选难例。分类看准确率/F1，转写看 CER/WER，检测看匹配、误检和漏检等。`,`任务类型对应的评价结果。`],[`类别映射（每行：预测类别=参考类别）|类别映射`,`把模型输出类别对应到本体类别或参考类别。不同名称需明确映射，不能仅凭显示名称当作同一类别。`,`模型输出、本体或参考定义，以及本次确认的映射。`],[`文本规范化`,`决定比较前是否忽略空白、大小写和标点。用于评价计算，原始预测与参考文本仍保留。`,`本次文本评价配置。`],[`材料缺失时|材料缺失处理`,`规定输入、预测或参考缺失时，是阻止提交还是跳过并单列原因。检查后要核对实际可执行条数。`,`本次检查配置和逐条材料检查。`],[`难例阈值`,`用当前选中指标确定哪些数据进入难例列表。修改输入后需点击应用；阈值方向以该指标定义为准。`,`已保存的评价结果及本次筛选设置。`],[`总输入|有效评价|无法评价 / 无预测目标|当前命中`,`分别统计任务固定名单、可计算指标的数据、无法评价的数据和当前阈值命中的数据。数量来自同一次运行。`,`当前难例任务的预测和评价结果。`],[`本体名称|Ontology|Schema`,`独立维护、可复用的标签体系，包含类别、对象、分类问题及属性。数据集不与某一本体永久绑定，任务引用具体已发布版本。`,`本体管理中的资源及版本。`],[`类别 / 分类|类别 / 分类数量|可用类别 / 分类`,`类别 Class 是标签名；对象 Object 是带框、掩码或位置的标注；整条分类 Classification 是给整条数据回答的问题。数量统计当前版本未归档定义。`,`本体版本的定义。`],[`类别或分类名称|名称 *`,`填写当前对象的识别名称，后续列表、映射和结果中使用；同一范围内需避免重名。`,`当前创建或编辑内容。`],[`类别或分类类型|定义类型`,`区分类别标签、带位置的对象和整条数据分类问题。不同类型提供不同标注工具或题型。`,`当前本体的任务类型及定义配置。`],[`标注工具或题型|标注工具|题型`,`指定结果怎样表达，例如矩形框、多边形、文本标签、单选、多选或评分。可选项需要匹配本体任务类型。`,`当前本体定义。`],[`对象属性 Attribute|属性题型`,`对对象补充属性，例如颜色、遮挡状态。属性依附于对象，可用单选、多选、文本等题型表达。`,`当前对象定义的属性。`],[`选项|选项名称|子选项名称`,`单选或多选允许填写的值，可配置子选项。任务结果应引用选项 ID，不能仅依赖显示名称。`,`本体分类问题或对象属性的选项。`],[`语义说明与识别要求`,`用通俗文字说明这个类别怎样判断，什么情况应选、边界怎样区分。帮助后续模型和标注人员按同一标准理解。`,`本体管理人员填写。`],[`本体模态|本体任务类型`,`先确定本体覆盖的内容和识别任务，再提供对应的类别定义、工具及题型。生成、转写等任务使用输出要求。`,`创建本体时选择。`],[`本体版本|来源本体版本|复制来源本体版本|子集 Ontology 版本`,`选择本次引用或复制的本体发布版本。已有任务保留原版本；更新本体不会改写历史结果。`,`本体管理的已发布版本。`],[`本体版本说明|版本说明`,`补充本体这次版本调整了哪些标签或规则，方便选择和追溯。`,`本体管理人员填写的版本信息。`],[`当前默认配置引用|任务引用`,`分别显示哪些子集默认推荐这个版本，以及哪些任务已经固定使用。默认推荐和实际任务引用分开统计。`,`预标注默认配置及任务快照。`],[`默认本体任务类型|默认本体输入字段`,`按“子集＋输入字段＋任务类型”保存推荐本体。只为之后新建任务提供默认值，每个任务仍保存实际采用的版本。`,`当前子集的预标注默认配置。`],[`预标注输入字段`,`从当前子集全部字段中选实际输入。图片、音频、视频、JSON 等按类型匹配任务，字段角色不限制选择。`,`当前子集字段规则。`],[`预标注任务类型`,`所选字段可以执行的任务。识别类任务选本体定义结果；生成、转写、OCR、结构化提取等按输出格式和要求配置。`,`平台支持的兼容任务。`],[`输出定义`,`识别任务引用一个或多个兼容的本体发布版本；生成任务使用结果名称、输出格式和输出要求。任务提交后保存快照。`,`本次选择的本体版本或生成配置。`],[`生成结果名称|结果名称`,`给这份独立结果起名，使用字母、数字和下划线，最多 64 字符。结果关联原数据，不覆盖原始字段。`,`创建预标注任务时填写。`],[`生成输出要求|输出要求`,`告诉模型需要输出什么内容、格式和注意事项。调整要求后需重新试运行样本。`,`本次生成任务的配置。`],[`输出字段|输出格式`,`定义生成结果的结构。结构化提取明确字段名及类型，转写保留时间片段，OCR 保留页码、文本块和位置。`,`当前任务类型及输出定义。`],[`结果保留置信度|预标注置信度阈值`,`0–1 之间的结果保留门槛，低于门槛的输出不采用；模型没有返回置信度时保留全部。它不代表准确率。`,`所选模型默认值，可在本任务中调整。`],[`同输出定义已有结果，跳过|本次跳过`,`已经有相同版本、子集、输入字段、任务类型和输出定义的有效结果，默认跳过。选择重新生成时保存新结果，旧结果保留。`,`已有任务结果与本次输入名单的比对。`],[`估计用量`,`按本次应处理条数和模型单价计算的预估值。Demo 显示演示积分，实际结算需要后端用量记录。`,`模型示例单价 × 本次应处理数量。`],[`结果来源|预标注结果来源|预标注任务 / 结果来源`,`选择要统计的任务及其结果。切换任务后，应随任务类型更新指标、分布和明细，不能混用其他任务的看板。`,`已保存的预标注任务与逐条结果。`],[`预标注统计范围|分析范围`,`决定统计任务固定输入，还是与当前查询求交集后的数据。要同时显示分母和未进入任务的数量。`,`任务固定名单及当前浏览查询。`],[`当前查询范围|任务固定输入|范围内任务输入|不在任务范围`,`分别显示查询数据量、任务原始名单、两者交集，以及查询中未参与该任务的数据。后者不计作处理失败。`,`查询名单与任务输入 ID 的比对。`],[`有效结果覆盖`,`当前统计范围中成功有结果和成功空结果的数量及占比。分母取范围内的任务输入，未处理和失败单列。`,`当前选中任务的逐条结果。`],[`成功有结果`,`处理成功，且输出非空、结构符合任务要求的数据条数。单条可能有多个对象或文本块。`,`当前任务状态为有效的结果。`],[`成功空结果|空结果`,`任务正常返回，但没有符合条件的对象或内容。它与失败、缺失、未处理分开统计。`,`当前任务状态为空结果的记录。`],[`结构异常|失败 / 结构异常`,`结构异常是已经返回内容，但不符合本任务输出定义；处理失败是调用或执行未成功。两个数量分别展示。`,`任务返回内容的结构校验与执行状态。`],[`置信度`,`模型对这个预测的把握程度，可按对象或结果展示。它不是实际准确率，没有返回时保留为空。`,`当前预标注任务的模型输出。`],[`类别分布|类别数量表|涉及数据`,`按任务类别统计对象/结果数量及涉及数据条数。一条数据可以包含多个对象或多个类别，所以类别数量可以大于数据量。`,`当前任务的有效识别结果。`],[`置信度分布`,`按模型返回的置信度分组查看结果。成功空结果、未提供置信度和处理失败需单列。`,`当前任务的有效预测结果。`],[`有输出率`,`在当前统计范围内，成功返回非空内容的数据比例。它只反映有无输出，不能作为内容正确率。`,`当前任务有效输出与统计分母。`],[`结构通过率`,`在返回可校验内容的数据中，符合结构要求的比例。分母是有效结果与结构异常之和。`,`生成任务的结构校验。`],[`转写片段数|转写累计时长|事件累计时长|文本块总数`,`按对应任务统计时间片段、累计时长或 OCR 文本块数量；结果对象数量和数据条数分别计算。`,`当前任务的 segments、事件时间段或 OCR blocks。`],[`结果对象 / 类别|输出内容|结果摘要`,`展示该条数据对应的对象、标签、位置或生成文本摘要。详情保留完整输出，不能把摘要当作完整结果。`,`当前任务保存的独立结果。`],[`时间范围（秒）|转写文本`,`每个转写片段的开始、结束时间及文本；列表音频还要标明具体资源。`,`音频转写任务返回的片段。`],[`页码|文本块|归一化坐标 xywh`,`OCR 返回的页号、识别文字和位置。xywh 表示左上角位置及宽高，归一化数值相对页面尺寸。`,`当前 OCR 任务输出。`],[`服务商`,`客户对象存储所用服务，例如 S3、OSS、Azure 或 GCS。不同服务使用对应的地址与授权。`,`客户存储连接配置。`],[`连接名称`,`供用户识别的一条客户存储连接名称。连接保存地址、桶、路径和授权，数据仍保存在客户存储中。`,`存储管理中维护的连接。`],[`服务地址`,`对象存储的访问端点，按所选服务商填写。保存时检查地址是否可达。`,`客户提供的存储访问配置。`],[`桶 / 容器|桶 / 容器 *`,`对象存储中实际保存文件的桶或容器。配合访问路径确定平台可以访问的范围。`,`客户连接配置。`],[`访问路径|目录／路径前缀|路径|保存路径|目标路径`,`限制读写的目录前缀。客户连接为空可表示整个桶；导入和新文件保存仍需确认具体目标。`,`存储连接或本次任务的路径配置。`],[`凭证|Access Key ID|Secret Access Key`,`用于访问客户存储的授权信息。密钥应隐藏展示，保存时按实际权限验证读取、浏览和写入能力。`,`客户授权的存储凭证；Demo 使用演示值。`],[`能力|读取来源|写入目标|最近验证|检查时间`,`分别显示能否浏览目录、读取对象和写入后读回，并记录最近验证时间。可读不代表可写。`,`保存连接时或重新验证时的检查结果。`],[`区域`,`平台桶所在区域，影响文件实际保存位置。创建时从支持的区域中选择。`,`存储桶配置。`],[`可见性`,`控制存储桶在平台内的可见范围。数据集内容读取还需要通过数据集自身的授权。`,`存储桶的可见性设置。`],[`已用容量 / 配额|已用容量|容量上限（TB，选填）`,`文件实际占用与该桶容量上限。达到配额后新写入暂停，已有文件仍可读；未单独设置时共享租户剩余额度。`,`平台存储计量与配额配置。`],[`文件数`,`桶内保存的对象数量，包含系统目录中的文件；不是数据集的数据条数。`,`存储对象清单。`],[`关联数据集|关联数据集 / 版本`,`引用或使用该存储位置的数据集及版本。按访问权限展示；删除前据此检查引用。`,`文件引用及存储策略关联。`],[`临时占用|临时文件`,`上传和处理中暂存文件的容量，也计入已用容量。Demo 的 tmp-upload 保留期为 7 天。`,`临时目录的对象清单和保留策略。`],[`实际位置|保存方式|资源内容`,`记录资源保存在平台桶，还是外部引用，以及实际 URI。外部引用不会自动复制原文件。`,`导入时采用的保存策略及资源定位。`],[`大小|大小 / 校验|校验信息`,`文件大小和校验摘要，帮助核对是否为当时使用的原内容。无法读取时不能补出未知值。`,`保存或检查资源时记录的文件信息。`],[`来源版本|来源与状态`,`记录导入时采用的来源位置、内容版本及最近读取状态。来源变化后，历史记录仍保留当时采用值。`,`导入记录和最近资源检查。`],[`媒体信息|解析状态|解析时间`,`图片尺寸、音视频时长和编码等基础属性，以及解析状态和时间。解析失败或未解析时保留状态。`,`媒体信息解析任务；Demo 显示示例属性。`],[`平台存储桶文件`,`平台托管桶中实际保存的文件占用，同一文件不按引用次数重复计量。`,`平台文件存储计量。`],[`客户目标新文件`,`平台导入或处理后写到客户目标存储的新文件容量，与客户原有来源文件分开统计。`,`平台写入记录。`],[`客户来源引用`,`数据集关联的客户原文件量；文件仍在客户存储中，不计入平台文件占用。`,`外部资源引用记录。`],[`结构化内容`,`原始字段、结果和管理信息的存储占用，与媒体文件分开计量。`,`平台结构化数据计量。`],[`导入内容`,`本期导入新增原始数据。人工补充标注结果不在本期入口内。`,`当前导入流程的内容类型。`],[`目标版本`,`新增数据写入的草稿。已发布版本不可写；首次创建时生成 V1.0 草稿。`,`当前数据集的可写版本。`],[`已授权连接|目标存储连接|目标连接`,`来源只提供已验证且可读的客户连接；目标还需要写入和写后读取能力。可以从当前流程新建连接。`,`存储管理中的授权连接及验证结果。`],[`Dataset Repository|数据集仓库`,`Hugging Face 上的仓库标识，配合 revision、config 和 split 确定本次读取范围。`,`本次输入的 Hugging Face 来源配置。`],[`固定 revision|revision|版本与范围`,`固定到一个明确的来源版本，避免同名仓库更新后读到不同内容。`,`来源仓库的 revision。`],[`config|来源 split`,`选择来源仓库的配置和划分。它们是读取来源范围；写入平台的目标划分在第一步选择。`,`来源仓库提供的配置与划分。`],[`来源字段 / 样本|来源字段|源字段|源行号`,`读取文件中的原字段名、样本值和行号。行号用于回查原文件，不能替代平台数据 ID。`,`本次来源文件。`],[`来源总数|准确记录数|已排除`,`完成读取后统计真实记录数；主动排除的记录不参与保存，实际参与量为总数减去排除量。`,`本次来源完整记录与排除名单。`],[`检查项|检查状态|检查结果`,`提交前核对目标权限、输入、字段类型和保存安排。修改来源、映射或范围后，需要重新检查。`,`当前配置的预检结果。`],[`保存安排|资源保存|保存时采用的策略|当前策略|策略版本`,`说明文件按哪一版策略保存及具体目标。新策略只影响之后提交的任务，已提交任务和重试沿用原策略。`,`数据集存储策略与任务提交快照。`],[`关联原任务|本次仅恢复`,`重试只处理原任务失败项；已经成功的数据保持不变，避免重复导入。`,`原任务固定输入及失败名单。`],[`数据文件格式`,`导出原始与系统字段使用的格式，例如 CSV、JSONL。不同类型的字段需要保留原值和资源 URI。`,`当前导出配置。`],[`实际导出范围`,`本次真正导出的版本、子集、划分及数据 ID。页面选择、完整查询和整范围需分别确认。`,`导出提交时固定的名单。`],[`必带文件|包内文件|文件清单`,`导出包包含数据文件、Manifest 和数据卡等。清单用于核对文件、范围和对应关系。`,`本次导出包生成记录。`],[`标注|结果接入|包含所选数据关联的全部标注结果`,`可随所选数据导出关联的独立标注结果；它不会覆盖原始字段，也不代表外部平台已经接收。`,`数据 ID 关联的预标注结果。`],[`外部执行|实际接入结果|包状态`,`导出文件生成和外部平台接收、训练、处理是不同状态。本 Demo 只演示本地生成，不提供外部执行进度。`,`平台文件生成记录；外部状态需由实际接入返回。`]]),Fr(Pr,[[`数据集管理`,`打开数据集目录，查看数据集、版本、规模和访问范围。`],[`本体管理`,`打开独立标签体系的管理页，维护类别、对象、属性和发布版本。`],[`存储管理`,`管理平台存储桶和客户对象存储连接，查看容量、权限和资源状态。`],[`新建数据集`,`填写基本信息、权限和目标存储，再选择是否导入首批数据。确认创建时建立数据集、default 子集和 V1.0 草稿。`],[`导入数据|导入到数据集`,`进入四步导入流程：确定目标、选择来源、确认字段和内容、检查并提交。新增数据写入草稿。`],[`分享|分享与权限`,`管理谁可以查看已发布数据，或复制当前版本、子集和划分的链接。链接不包含临时筛选、选择或凭证。`],[`更多|数据集设置`,`打开数据集的设置入口，包括信息、权限、存储策略、预标注默认配置和生命周期操作。`],[`概览`,`查看当前版本规模、数据集卡、子集划分、版本和最近 3 条操作记录。`],[`数据浏览|去数据浏览|返回数据浏览|查看本版全部数据`,`进入原始数据列表；顶部范围、查询和筛选共同决定结果。行和卡片都以完整一条数据为单位。`],[`语义画布`,`将已有向量投影成二维点位，便于看分布和框选数据。需要时在这里生成画布。`],[`难例挖掘`,`打开难例任务列表，配置预测来源、参考或评分依据，再按指标筛选需要复核的数据。`],[`运行记录`,`查看已保存的分析和运行记录，恢复当时的范围、参数和结果。`],[`检查并发布`,`检查当前草稿是否可发布；有阻断项时先处理。确认发布后，固定当前版本内容，草稿操作不再直接写入该版本。`],[`创建版本草稿|新建草稿`,`选择继承方式并创建可写版本。已有草稿时先使用现有草稿；发布版本中的成员保持固定。`],[`编辑信息|编辑数据集信息`,`修改名称、说明、语言和任务类别等信息。发布数据卡按对应版本保存的内容展示。`],[`查看存储设置`,`查看当前保存策略、目标路径和历史策略；需要更改时配置之后提交任务使用的新策略。`],[`查看完整操作记录|查看操作记录|操作记录`,`打开同一份操作记录的明细列表，可按版本、操作类型、操作者、日期和结果筛选，并展开前后变更。`],[`新建子集`,`在当前草稿中创建一个子集。子集使用自己的字段规则，导入或移动数据后才有成员。`],[`复制子集`,`选择引用成员或仅复制结构，复制到目标草稿。原始数据身份和文件沿用已有记录。`],[`合并子集|确认合并`,`选择至少两个字段规则一致的子集，明确各来源划分的目标归属。确认后创建新子集并移出来源子集。`],[`设置`,`修改这一行子集的信息和默认标记；字段规则与划分通过各自入口维护。`],[`划分设置`,`查看、增加或重命名子集内的划分，并进入成员分配。删除有成员的划分前需确定成员去向。`],[`移出本版|从当前草稿移出子集`,`只从当前草稿移除子集与成员关系；数据身份、资源和历史版本保留。需要先处理默认子集。`],[`表格视图`,`每行显示一条数据，每列对应字段。切换展示方式保留已应用的查询、排序、分页和选择。`],[`画廊视图`,kr],[`视图管理`,`管理当前子集保存的视图，可打开、更新当前视图或确认删除。删除视图只移除保存的查询设置。`],[`创建视图`,`保存当前范围、已应用查询、排序和展示设置，创建后自动选中。名称必填且同子集唯一，最多 64 字，同子集最多 5 个。`],[`打开视图`,`恢复这份视图保存的范围、查询和展示设置。实际数据取当前对应版本，不额外复制一份数据。`],[`更新当前视图`,`用当前已应用的范围、查询和展示设置更新正在使用的视图，名称及说明保留。`],[`确认删除视图`,`删除这份保存的视图。只移除查询和展示设置，原始数据继续保留。`],[`随机抽取`,`从当前完整查询结果中按数量或比例抽取数据，先生成拟选名单，确认后加入当前页面的选择。`],[`数据质量`,`展开按字段扫描质量的工作区，查看检测项、分布和潜在问题。它使用当前顶部范围。`],[`重复检测`,`按所选字段检测完全重复或语义近重复。缺少哈希或向量时，在该任务内准备，再查看重复组和保留项。`],[`数据聚类`,`按所选输入和向量模型把数据分组，查看簇成员、代表样本和独特性排序；需要时可在语义画布中查看。`],[`预标注统计|查看结果统计`,`打开预标注结果分析，按所选任务类型展示类别、对象、转写、OCR 或生成等相应指标。`],[`API|通过 API 读取`,`查看读取当前固定版本和范围的代码示例。示例不携带凭证，复制不会创建任务。`],[`导出|导出已选|导出所选数据|导出本页所选数据`,`进入导出配置，核对实际名单、字段、标注结果和文件格式，再检查生成导出包。`],[`查找相似|以此数据检索相似`,`把当前样本作为相似查询输入。字段入口使用该字段；数据 ID 入口按整条数据选择兼容的已构建字段组合。`],[`移动|移动到子集 / 划分|确认移动|创建草稿并移动`,`把所选成员移动到目标草稿的子集和划分，可在流程中创建目标。提交前检查字段规则和完整名单，保留数据 ID。`],[`删除数据|从当前草稿删除|从当前草稿删除数据`,`从当前草稿版本移除选中成员；已发布版本、数据身份和原资源保留。只有草稿可以执行。`],[`模型预标注`,`以当前选择创建预标注任务：先选输入字段和任务，再定义本体或生成输出、模型参数，试运行后提交。`],[`清空|清空选择|清空本页选择|确认清空`,`取消当前页面的临时勾选，原始数据和已保存结果继续保留。`],[`移除此条件|移除条件|移除查询|清除阈值`,`移除当前这一项查询限制并刷新结果；其他条件按当前配置保留。`],[`按相似度排序`,`恢复当前相似查询的默认相似度顺序；查询和已选名单保留。`],[`上一页|下一页`,`切换当前结果的显示页。完整结果和已有选择保留；到首尾页时对应按钮禁用。`],[`上一条|下一条`,`在当前查看名单中切换数据详情，不重新生成查询或任务结果。`],[`关闭|完成`,`关闭当前详情或设置面板，返回原页面。需要确认提交的业务操作通过面板中的专用按钮执行。`],[`取消|返回编辑|继续填写|继续执行`,`放弃当前确认或返回填写状态；已保存的数据和任务结果保留。`],[`上一步`,`返回上一配置步骤并保留已填内容。修改影响输入或配置的内容后，需要重新检查或试运行。`],[`下一步`,`检查当前步骤的必填项，通过后进入下一步。还未到最终确认时，不创建正式任务。`],[`保存|提交|确认`,`按当前面板的配置保存或提交。按钮可用前需要满足本页必填项、检查和确认条件。`],[`生成预览`,`按当前配置生成候选名单或分配方案，先核对数量与数据 ID。预览不直接修改成员归属。`],[`确认保存分配`,`把已预览并核对的成员分配写入当前草稿。配置变更后需要重新生成预览。`],[`分配数据`,`配置子集内各划分的成员分配，核对比例、数量和未命中数据的承接划分。`],[`新增|新建划分`,`在当前子集中新增空划分；成员需要通过分配或移动进入。`],[`重命名`,`修改当前划分的显示名称，历史任务和发布数据卡保留当时采用的名称。`],[`移除 / 合并`,`移除当前划分前，明确已有成员并入哪个划分；当前草稿至少保留一个划分。`],[`复制链接|分享当前定位`,`复制当前版本、子集和划分的定位链接。访问者仍按自己的权限打开。`],[`展示二维码|保存二维码`,`用二维码分享同一定位链接，扫码后按访问者权限查看。`],[`公开页预览|公开预览|匿名视角`,`按匿名访问者视角预览已发布数据。只有符合公开条件的数据集可用。`],[`回收站`,`查看已回收的数据集、恢复截止时间和清理任务，可检查恢复或提前结束恢复期。`],[`删除数据集`,`将整个数据集和全部版本移入回收站，停止访问和新的使用。没有未结束的内容写入任务时才可确认。`],[`检查并恢复|恢复数据集`,`在保留期内检查名称、文件与权限等条件，通过后恢复原数据集及保留文件。`],[`彻底删除|清空回收站`,`打开清理范围确认。确认后立即结束恢复期，清理数据集业务内容和无其他引用的专属平台文件；共享文件和客户原文件保留。`],[`重试失败项|重试未完成部分|补扫未完成数据`,`沿用原范围和配置，只处理失败、缺失或未完成部分；已有成功结果保留。`],[`构建语义画布|生成二维投影`,`检查当前字段、模型和参与名单，准备向量后生成二维点位。已有可用向量可复用，投影失败可单独恢复。`],[`放大画布|缩小画布`,`只改变画布的查看比例，数据坐标、分析结果和已选名单保留。`],[`平移`,`拖动查看画布的其他区域，鼠标拖动不用于选择数据。`],[`框选`,`拖出矩形预览其中的数据点，核对后点击“加入当前选择”。`],[`重置`,`把画布缩放和位置恢复到初始视角，不删除投影结果。`],[`加入当前选择|加入选择|加入本页选择|加入本页选择|加入当前分组全部数据|加入当前结果全部数据`,`将当前结果对应的完整数据 ID 加入本页临时选择，已选 ID 不重复加入。之后可执行移动、预标注或导出。`],[`取消圈选`,`清除这次尚未确认的框选预览，已有选择保留。`],[`在语义画布中查看`,`带上当前聚类分析结果进入画布，以同一向量基础生成或复用二维投影。`],[`导出分析报告|导出质量报告|下载报告`,`下载本次固定输入、参数、状态和分析结果，便于离开页面后核对。`],[`加入排序前 N 条`,`将当前结果排序前指定数量的数据加入当前选择。取数基于完整排序结果。`],[`每簇取 1 条代表样本`,`从当前每个非空簇选择一条代表数据，加入当前页面的选择。`],[`保存保留项`,`保存各重复组打算留下的数据。其余数据作为冗余候选，后续仍需确认才能移出草稿。`],[`选择全部冗余数据`,`将当前分析中除保留项外的冗余数据加入选择，方便核对和后续处理。`],[`移出当前草稿|从当前草稿移出冗余数据`,`确认名单后仅移出当前草稿中的冗余成员，保留历史版本、原资源和本次分析快照。`],[`选择当前类型全部字段|取消当前类型选择`,`批量勾选或取消当前类型下的扫描字段；其他类型已选字段保持原样。`],[`保存阈值`,`保存当前指标的正常区间，沿用已有扫描数值更新潜在问题；该项需要重新复核。`],[`恢复默认阈值`,`把当前检测项的正常区间恢复为默认值，不重新扫描原数据。`],[`返回扫描总览`,`返回字段清单，查看各类型字段的检测项、覆盖和问题数量。`],[`新建难例挖掘任务`,`依次配置数据与任务、预测来源、评价依据和检查试运行；正式提交后固定输入与参数。`],[`检查配置|检查输入|检查全部数据|检查导出|执行预检`,`按当前完整输入检查所需材料、字段、权限及配置，列出可处理和阻断项。修改配置后检查失效。`],[`少量试运行|试运行样本|重新试运行`,`用少量本次输入检查模型输出和评价效果，不保存正式全量结果。修改前序配置后需要重试。`],[`提交正式任务`,`将检查通过的固定名单和全部参数提交为正式任务，进入任务详情查看执行与结果。`],[`应用阈值`,`按当前填写的指标和阈值刷新难例结果，原预测与评价记录保留。`],[`沿用配置`,`以此任务的输入方式、模型和评价配置为起点新建任务，不覆盖原运行记录。`],[`复用预测并重新评价`,`保留已有预测，使用新的评分规则生成另一份评价记录，不再次调用任务模型。`],[`新建本体`,`创建可复用的标签体系，选择模态和识别任务，再配置类别、对象、分类问题及属性。`],[`管理 / 新建本体`,`进入本体管理，当前预标注草稿会保留；本体发布后返回继续选择。`],[`保存默认配置`,`保存当前子集、输入字段和任务类型的推荐本体。之后新建任务可使用推荐值，已有任务保留原版本。`],[`查看与配置`,`打开当前本体，查看版本和定义；有管理权限时维护草稿并发布。`],[`添加类别 / 分类`,`在本体草稿中新增类别、带位置的对象或整条分类问题，按任务提供兼容工具。`],[`从其他本体复制`,`选择已发布的来源本体版本，将选中的类别或分类复制到当前草稿后继续配置。`],[`添加属性`,`为当前对象增加属性，例如颜色或遮挡程度，并设置题型和选项。`],[`添加选项|添加子选项`,`为当前单选/多选问题增加允许取值，可按需添加下一级。`],[`移除属性|移除字段|移除`,`移除当前正在编辑的这一项定义或配置；正式保存前按当前表单检查完整性。`],[`保存到草稿`,`把当前类别或分类配置保存到本体草稿，发布前仍可继续修改。`],[`确认发布`,`通过当前检查后发布本体版本，固定本版内容。已有默认配置和任务保留引用的版本。`],[`复制到当前草稿`,`将所选来源版本中的定义复制到当前本体草稿，来源本体继续保留。`],[`创建并配置`,`先创建本体草稿，再进入类别和分类配置。`],[`添加字段`,`在当前配置中新增一个字段，补齐名称和类型后再检查。`],[`执行本地演示`,`使用本 Demo 的模拟模型处理固定名单并保存示例结果，随后可在统计页查看同一批结果。`],[`更新统计`,`用当前任务已保存结果和统计范围刷新看板，指标随任务类型变化。`],[`查看结果|查看详情|详情|查看明细`,`打开这一行对象的详情，查看完整内容、来源、状态和相关配置。`],[`新增连接|新建对象存储连接`,`录入客户对象存储地址、桶、路径和授权。保存时自动验证；在导入中创建后可继续选择该连接。`],[`保存并自动验证|保存并重新验证|重新验证并保存`,`按当前连接配置自动检查可达性、浏览、读取和写入后读回，通过后保存。`],[`重新验证`,`用连接最近保存的配置重新检查可用能力和状态。`],[`新建存储桶`,`在租户配额内填写名称、区域、容量上限和可见性，提交创建平台桶。`],[`设为默认`,`将这个桶设为新数据集配置的预选桶，同时取消原默认标记。`],[`修改可见性`,`调整平台内谁可以看到存储桶，数据集读取仍检查自身权限。`],[`停用`,`确认影响范围后暂停新的绑定和写入，已保存历史文件保留。`],[`恢复`,`检查当前存储状态和容量，通过后恢复新绑定与写入。`],[`对象访问凭证|生成只读凭证`,`生成限定桶和权限范围的临时凭证，完整内容仅展示一次；到期、吊销或权限变化后失效。`],[`操作审计`,`查看存储桶的创建、凭证、同步、删除等操作及操作
